[settings]
disable_backends = ["aqua", "asdf", "vfox"]
cargo.binstall = true

[tools]
"github:cli/cli" = "latest"
"github:jj-vcs/jj" = "latest"
rust = "latest"
cargo-binstall = "latest"
watchexec = "latest"
node = "26"
"github:burntsushi/ripgrep" = "latest"
"github:astral-sh/uv" = "latest"
"pypi:git+https://github.com/aws/aws-cli.git" = "v2"
"github:nolabs-ai/nono" = "latest"
"github:typst/typst" = "latest"
"github:aaif-goose/goose" = "latest"
"github:earendil-works/pi" = "latest"

[tools."http:opencode"]
version = "2.0.28"
version_order = "semver"
url = "https://opencode.ai/files/bin/{version}/opencode-linux-x64.tar.gz"

[wrappers.opencode]
command = "nono"
args = ["run", "--silent", "--profile", "opencode-mise", "--allow-cwd", "--", "opencode"]

[wrappers.pi]
command = "nono"
args = ["run", "--silent", "--profile", "pi-mise", "--allow-cwd", "--", "pi"]

[dotfiles]
"~/.agents/skills" = { mode = "track" }
"~/.bash_profile" = { mode = "track" }
"~/.bashrc" = { mode = "track" }
"~/.bashrc.d" = { mode = "track" }
"~/.config/mise/config.toml" = { mode = "track" }
"~/.config/nono/profiles" = { mode = "track" }
"~/.config/nono/profiles/pi-mise.json" = { mode = "track" }
"~/.config/opencode/skills" = { mode = "track" }
"~/.config/srt/.opencode-srt-settings.json" = { mode = "track" }
"~/.local/bin/opencode" = { mode = "track" }
"~/.var/app/dev.zed.Zed/config/zed" = { mode = "track" }

[bootstrap.packages]
"brew-cask:zed" = "latest"
